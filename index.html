<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curso - Seguridad Operacional</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glass-container">
        <!-- Botón Anterior Flotante -->
        <button id="btn-prev" class="nav-btn floating-prev" disabled>
            <span class="arrow">◀</span> Anterior
        </button>

        <!-- Columna Izquierda (Avatar, Título, Texto) -->
        <div class="left-column">
            <!-- Fila Superior: Avatar + Título -->
            <div class="header-row">
                <!-- Avatar rediseñado (Squircle) con Barra de progreso -->
                <div class="avatar-squircle-wrapper glass-panel">
                    <svg class="progress-svg" width="160" height="160">
                        <!-- Rectángulo redondeado para el fondo -->
                        <rect class="progress-rect__background" x="8" y="8" width="144" height="144" rx="35" ry="35" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="6"/>
                        <!-- Rectángulo redondeado para el progreso -->
                        <rect class="progress-rect" x="8" y="8" width="144" height="144" rx="35" ry="35" fill="none" stroke="#ffb800" stroke-width="6" stroke-linecap="round"/>
                    </svg>
                    <img src="avatar/avatar.png" alt="Avatar del usuario" class="avatar-image-squircle">
                </div>
                
                <!-- Panel del Título -->
                <div class="title-panel glass-panel">
                    <h1 id="step-title">Servicio de control de fauna del aeropuerto trabaja en el lado aire para minimizar</h1>
                </div>
            </div>
            
            <!-- Fila Inferior: Texto -->
            <div class="text-panel glass-panel">
                <p id="step-text">
                    Las compañías aéreas marcan una serie de procedimientos para atender sus aviones que cumplen con lo establecido por las organizaciones en cuanto a la seguridad operacional.
                </p>
                <div class="progress-text">
                    Paso <span id="current-step">1</span> de <span id="total-steps">3</span>
                </div>
            </div>
        </div>

        <!-- Columna Derecha (Imagen y Botón Siguiente) -->
        <div class="right-column">
            <!-- Panel de Imagen -->
            <div class="image-panel glass-panel">
                <img id="step-image" src="fotos/woman-airport-service-agent-with-passport-helping-traveler-check-terminal-counter-female-passenger-assistant-with-smile-travel-security-immigration-documents-airline-control.jpg" alt="Agente de servicio en el aeropuerto">
            </div>
            
            <!-- Botón Siguiente Flotante -->
            <button id="btn-next" class="nav-btn floating-next">
                <span id="btn-next-label">Siguiente</span> <span class="arrow">▶</span>
            </button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
